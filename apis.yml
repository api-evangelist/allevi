name: Allevi
description: Allevi is a bioprinting company that designs and manufactures 3D bioprinters,
  bioinks, and accompanying software for tissue engineering, regenerative medicine, and
  life-sciences research. Its desktop bioprinters and biomaterials let researchers fabricate
  living tissue constructs for drug discovery, disease modeling, and organ-on-chip work.
  Allevi was acquired by 3D Systems and operates as part of its regenerative medicine
  portfolio. The company publishes bioprinting protocols, application notes, webinars,
  and white papers, but exposes no public web API, developer portal, or SDK at this time.
